name: JSON SQLite same-date acceptance (no publication)
on:
  push:
    branches: [feature/direct-mtgjson-slim-json]
    paths:
      - ".github/workflows/json-cross-format-audit.yml"
      - "scripts/audit_json_sqlite.py"
      - "tests/test_json_sqlite_audit.py"
      - "scripts/inspect_official_sqlite.py"
      - "scripts/audit_json_field_selection.py"
      - "slim.py"
      - "tests/test_upstream_schema_order.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-format:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Verify native Python Zstandard support
        run: python -c "from compression import zstd; print(zstd.zstd_version)"
      - name: Install JSON parser in isolated test job
        run: python -m pip install -r requirements-json.txt
      - name: Run cross-format unit tests and ensure mismatch fails closed
        run: python -m unittest discover -s tests -p "test_json_sqlite_audit.py" -v
      - name: Download both official MTGJSON archives with their SHA-256 checksums
        run: |
          mkdir -p evidence
          python slim.py download --directory downloads-sqlite --report evidence/sqlite-source-download.json
          python slim_json.py download --directory downloads-json
      - name: Inspect verified official SQLite and report schema drift without changing profile 2.3
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python scripts/inspect_official_sqlite.py \
            --archive downloads-sqlite/AllPrintings.sqlite.xz \
            --checksum downloads-sqlite/AllPrintings.sqlite.xz.sha256 \
            --profile profiles/v2_3.json --output-dir output-official-sqlite \
            --report evidence/official-sqlite-schema.json
      - name: Build and verify slim SQLite against reviewed order-compatible official schema
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python slim.py build \
            --archive downloads-sqlite/AllPrintings.sqlite.xz \
            --sha256 "$(cat downloads-sqlite/AllPrintings.sqlite.xz.sha256)" \
            --profile profiles/v2_3.json --output-dir output-sqlite \
            --tool-commit "$GITHUB_SHA" --report evidence/sqlite-source-build.json
      - name: Build and verify slim JSON independently from official JSON
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python slim_json.py build \
            --archive downloads-json/AllPrintings.json.xz \
            --checksum-path downloads-json/AllPrintings.json.xz.sha256 \
            --output-dir output-json
      - name: Independent field-selection audit against official JSON
        shell: bash
        run: |
          set -euo pipefail
          json_file=$(python -c 'import json; print(json.load(open("output-json/json-manifest.json"))["output"]["json"]["name"])')
          python scripts/audit_json_field_selection.py \
            --source downloads-json/AllPrintings.json.xz \
            --slim-json "output-json/$json_file" \
            --report evidence/json-field-selection.json
      - name: Compare same-date JSON and validated slim SQLite printing identities and fields
        run: |
          python scripts/audit_json_sqlite.py \
            --json-package output-json --sqlite-package output-sqlite \
            --report evidence/json-sqlite-cross-format.json
      - name: Retain evidence only, never publish data candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independent-json-sqlite-identity-audit
          path: |
            evidence/*.json
            output-json/json-manifest.json
            output-official-sqlite/manifest.json
            output-sqlite/manifest.json
            output-sqlite/validation.json
          if-no-files-found: warn
          retention-days: 14
