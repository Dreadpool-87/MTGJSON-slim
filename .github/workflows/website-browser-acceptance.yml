name: Independent website browser acceptance PR27 PR29
on:
  push:
    branches:
      - test/website-browser-acceptance-20261115
  pull_request:
    paths:
      - '.github/workflows/website-browser-acceptance.yml'
      - 'tests/browser_live_acceptance.py'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 27
            head: '3833539171eb19c7dca2a7b6f083ee1323a51e7e'
          - pr: 29
            head: 'e76605c8c4e1d39d47e47a3cfb872d76aedc5a8e'
    steps:
      - name: Checkout isolated browser acceptance harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Playwright and real Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Preserve test script outside source checkout
        run: cp tests/browser_live_acceptance.py "$RUNNER_TEMP/browser_live_acceptance.py"
      - name: Fetch and verify immutable PR source
        env:
          PR_NUMBER: ${{ matrix.pr }}
          EXPECTED_SHA: ${{ matrix.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
          ACTUAL_SHA=$(git rev-parse FETCH_HEAD)
          echo "PR_${PR_NUMBER}_SHA=${ACTUAL_SHA}"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          git checkout --detach "$ACTUAL_SHA"
      - name: Run real Chromium desktop/mobile/no-JS against live GitHub API
        env:
          PR_NUMBER: ${{ matrix.pr }}
          EXPECTED_SHA: ${{ matrix.head }}
        run: |
          python "$RUNNER_TEMP/browser_live_acceptance.py" \
            --site-dir docs --pr "$PR_NUMBER" --expected-head "$EXPECTED_SHA" \
            --out-dir "$RUNNER_TEMP/browser-acceptance"
      - name: Retain screenshots and machine-readable results on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-browser-acceptance-pr${{ matrix.pr }}
          path: ${{ runner.temp }}/browser-acceptance/
          if-no-files-found: warn
          retention-days: 14