name: Preview website selector Chromium acceptance
on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/release-downloads.js'
      - 'tests/browser_download_selector.py'
      - '.github/workflows/website-selector-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real browser acceptance without public API quota dependence
        run: python tests/browser_download_selector.py --out "$RUNNER_TEMP/website-selector"
      - name: Retain desktop/mobile/no-JS screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-selector-browser-proof
          path: ${{ runner.temp }}/website-selector/
          if-no-files-found: warn
          retention-days: 14
