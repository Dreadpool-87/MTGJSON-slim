name: Preview website selector Chromium acceptance
on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/release-downloads.js'
      - 'tests/browser_download_selector.py'
      - '.github/workflows/website-selector-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    # Playwright 1.56 cannot install Chromium on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real browser acceptance without public API quota dependence
        run: python tests/browser_download_selector.py --out "$RUNNER_TEMP/website-selector"
      - name: Retain desktop/mobile/no-JS screenshots and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-selector-browser-proof
          path: ${{ runner.temp }}/website-selector/
          if-no-files-found: warn
          retention-days: 14
