name: Temporary scheduled trigger probe
on:
  schedule:
    - cron: '9 12 17 11 *'
      timezone: 'Europe/Brussels'
permissions: {}
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record scheduled trigger only
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          printf 'event=%s\nschedule=%s\ncommit=%s\n' "$TRIGGER_EVENT" "$TRIGGER_SCHEDULE" "$WORKFLOW_COMMIT"
          date -u '+runner_utc=%Y-%m-%dT%H:%M:%SZ'
          TZ=Europe/Brussels date '+runner_brussels=%Y-%m-%dT%H:%M:%S%z'
