name: JSON full-source acceptance preview (no publication)
on:
  push:
    branches: [feature/direct-mtgjson-slim-json]
    paths:
      - ".github/workflows/json-source-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-json-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Verify native Python Zstandard support
        run: python -c "from compression import zstd; print(zstd.zstd_version)"
      - name: Install isolated JSON streaming parser
        run: python -m pip install -r requirements-json.txt
      - name: Retrieve checksum-verified MTGJSON AllPrintings JSON
        run: python slim_json.py download --directory downloads-json
      - name: Build slim JSON directly and compare every set to original source
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python slim_json.py build \
            --archive downloads-json/AllPrintings.json.xz \
            --checksum-path downloads-json/AllPrintings.json.xz.sha256 \
            --output-dir output-json
      - name: Rebuild identical source and verify reproducible hashes
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python slim_json.py build \
            --archive downloads-json/AllPrintings.json.xz \
            --checksum-path downloads-json/AllPrintings.json.xz.sha256 \
            --output-dir output-json-repeat
          python - <<'PY'
          import json
          from pathlib import Path
          first = json.loads(Path("output-json/json-manifest.json").read_text())
          repeat = json.loads(Path("output-json-repeat/json-manifest.json").read_text())
          assert first == repeat, "Repeated same-source JSON build changed manifest content"
          for kind in ("json", "xz"):
              assert first["output"][kind]["sha256"] == repeat["output"][kind]["sha256"]
          print("SECOND_BUILD_BYTE_IDENTICAL_PASS")
          PY
      - name: Generate ZIP and Zstandard from validated full slim JSON
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python scripts/package_json_formats.py \
            --package output-json --report json-extra-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("json-extra-verification.json").read_text())
          manifest = json.loads(Path("output-json/json-manifest.json").read_text())
          assert set(report) == {"zip", "zstd"}
          assert all(item["unpacked_sha256"] == manifest["output"]["json"]["sha256"]
                     for item in report.values())
          print("FULL_JSON_ZIP_ZSTD_ROUNDTRIP_PASS")
          PY
      - name: Record independent summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("output-json/json-manifest.json").read_text())
          assert m["verified"] is True
          assert m["counts"]["cards"] > 100000
          assert m["counts"]["sets"] > 100
          assert m["counts"]["tokens"] > 1000
          print(json.dumps(m, sort_keys=True, indent=2))
          PY
      - name: Retain evidence but not large source or candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: json-source-acceptance-evidence
          path: |
            output-json/json-manifest.json
            output-json/*.sha256
            json-extra-verification.json
          if-no-files-found: warn
          retention-days: 14
